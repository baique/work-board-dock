name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    branches: [master]

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Run frontend tests + typecheck
        run: |
          bun run test
          bun run typecheck

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build & release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "tiptip v__VERSION__"
          releaseBody: "tiptip Windows 安装包（NSIS/MSI），见下方 Assets。"
          releaseDraft: false
          prerelease: false
